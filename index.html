<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STREET FASHIÓN POS</title><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Street Fashión POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior negra tipo etiqueta de prenda + módulos en una sola columna; la caja (POS) en dos columnas en escritorio. */
:root{
  --c1:#2a43ff; --c2:#ff2d87; --c3:#ff8a00; --c4:#12a150; --c5:#8b3dff; --c6:#00a3c4; --c7:#f2b705; --c8:#e5383b;
  --bg:#eceef3; --surface:#fbfbfd; --surface-2:#f3f4f8; --ink:#14161c; --muted:#5b6170; --line:#d5d8e1;
  --accent:#2a43ff; --accent-ink:#ffffff; --accent-soft:#e3e7ff;
  --tag:#14161c; --tag-ink:#f5f6fa;
  --ok:#17804a; --ok-soft:#ddf3e6; --warn:#a85f00; --warn-soft:#fdeccf; --bad:#c62a33; --bad-soft:#fbe0e1;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#171a21; --surface-2:#1e222b; --ink:#eceef3; --muted:#9aa1b0; --line:#2b303b;
  --accent:#7385ff; --accent-ink:#0b0d14; --accent-soft:#232a52;
  --tag:#05060a; --tag-ink:#eceef3;
  --ok:#43c482; --ok-soft:#163626; --warn:#f0a53c; --warn-soft:#3a2a12; --bad:#ff6f74; --bad-soft:#3d1a1d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#171a21; --surface-2:#1e222b; --ink:#eceef3; --muted:#9aa1b0; --line:#2b303b;
  --accent:#7385ff; --accent-ink:#0b0d14; --accent-soft:#232a52;
  --tag:#05060a; --tag-ink:#eceef3;
  --ok:#43c482; --ok-soft:#163626; --warn:#f0a53c; --warn-soft:#3a2a12; --bad:#ff6f74; --bad-soft:#3d1a1d;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tag)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--tag);color:var(--tag-ink)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{background:var(--accent);color:#fff;padding:4px 6px;border-radius:4px;font-weight:800}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10px;opacity:.6;letter-spacing:.08em}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--tag-ink);opacity:.7;font:600 14px var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button:hover{opacity:1}
nav button[aria-current="page"]{opacity:1;background:var(--tag-ink);color:var(--tag)}
main{padding-block:22px 60px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,26px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700;text-wrap:balance}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi .v{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main .l{color:inherit;opacity:.8}
/* indicadores y accesos: colores suaves, texto nítido */
.k1{--kc:#3346f0;--kl:#a9b3ff;--kb:#eef0ff;--kd:rgba(99,116,255,.15)}
.k2{--kc:#d81b60;--kl:#ff9ec3;--kb:#ffeef4;--kd:rgba(255,92,150,.14)}
.k3{--kc:#b45f00;--kl:#ffc777;--kb:#fff5e6;--kd:rgba(255,170,51,.14)}
.k4{--kc:#00847a;--kl:#6ee0d2;--kb:#e6f7f5;--kd:rgba(31,200,170,.14)}
.k5{--kc:#7b2fc9;--kl:#cfa6ff;--kb:#f4ecfd;--kd:rgba(170,110,255,.15)}
.k6{--kc:#475569;--kl:#b8c4d6;--kb:#eef1f5;--kd:rgba(148,163,184,.14)}
.kpi.k1,.kpi.k2,.kpi.k3,.kpi.k4,.kpi.k5,.tile{background:var(--kb);border:1px solid color-mix(in srgb,var(--kc) 22%,transparent);border-left:4px solid var(--kc);color:var(--ink);-webkit-font-smoothing:antialiased}
.kpi.k1 .l,.kpi.k2 .l,.kpi.k3 .l,.kpi.k4 .l,.kpi.k5 .l{color:var(--kc);font-weight:600;font-size:13px;opacity:1}
.kpi.k1 .v,.kpi.k2 .v,.kpi.k3 .v,.kpi.k4 .v,.kpi.k5 .v{font:700 26px var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.tile b{color:var(--kc);font-weight:700}.tile span{color:var(--ink);opacity:.78}
.tile:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--kc) 18%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi:is(.k1,.k2,.k3,.k4,.k5),:root:not([data-theme="light"]) .tile{background:var(--kd);border-color:color-mix(in srgb,var(--kl) 25%,transparent);border-left-color:var(--kl)}
:root:not([data-theme="light"]) .kpi:is(.k1,.k2,.k3,.k4,.k5) .l,:root:not([data-theme="light"]) .tile b{color:var(--kl)}}
:root[data-theme="dark"] .kpi:is(.k1,.k2,.k3,.k4,.k5),:root[data-theme="dark"] .tile{background:var(--kd);border-color:color-mix(in srgb,var(--kl) 25%,transparent);border-left-color:var(--kl)}
:root[data-theme="dark"] .kpi:is(.k1,.k2,.k3,.k4,.k5) .l,:root[data-theme="dark"] .tile b{color:var(--kl)}
.brand img{height:30px;width:auto;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px;display:block}
.plogo{height:64px;width:auto;max-width:180px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:500 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.fields .span2{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-neutral{background:var(--surface-2);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.tag-ex{font:600 10px var(--f-mono);letter-spacing:.06em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:middle}
.chart{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--f-mono)}
.chart .bar{opacity:.88}
.chart .bar.now{opacity:1;stroke:var(--ink);stroke-width:2}
.chart .bar:hover{opacity:1}
.chart .vlab{fill:var(--ink);font:600 11px var(--f-mono)}
.rank{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.rank .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rank .nm small{font-weight:400;color:var(--muted)}
.rank .val{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.rank .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--rc,var(--accent));border-radius:3px}
.rank li .val{color:var(--rc,var(--ink))}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.pos{grid-template-columns:1fr}.cart{position:static}}
@media (max-width:640px){nav{flex-basis:100%;margin:0 -6px}.top-in{gap:8px}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.prod{display:grid;gap:4px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.prod:hover:not(:disabled){border-color:var(--accent)}
.prod:disabled{opacity:.45;cursor:not-allowed}
.prod .pn{font-weight:600;font-size:14px;line-height:1.25}
.prod .pv{font-size:12px;color:var(--muted)}
.prod .pp{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}
.prod .pp b{font:600 14px var(--f-mono)}
.prod .pp span{font:500 11px var(--f-mono);color:var(--muted)}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cl .q{display:flex;align-items:center;gap:6px}
.cl .q button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:600 15px var(--f-mono)}
.tot{display:grid;gap:4px;font-size:14px}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .grand{font:800 22px var(--f-display);padding-top:6px;border-top:2px solid var(--ink);margin-top:4px}
.tot .grand span:last-child{font-family:var(--f-mono);font-weight:600}
.err{color:var(--bad);font-size:13px;font-weight:600}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.banner .wrap{padding-block:10px}
/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;border:1px solid var(--line);width:min(640px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:20px;display:grid;gap:16px}
.sheet.narrow{width:min(420px,100%)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
/* Comprobante en pantalla */
.receipt{background:#fff;color:#111;font:12px/1.55 "Courier New",var(--f-mono);padding:16px 12px;border-radius:4px;border:1px solid #ddd;width:100%;max-width:360px;margin:0 auto;overflow-x:auto}
.receipt .rm{white-space:pre}
.receipt .rh{font:13px/1.6 Arial,Helvetica,sans-serif;text-align:center}
.receipt .c{text-align:center}
.receipt .b{font-weight:700}
.receipt .big{font-size:17px}
.receipt .rh.c{font-size:15px}
.receipt .sm{font-size:10px;white-space:normal}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.sheet.wide{width:min(880px,100%)}
.inv-wrap{overflow-x:auto;background:#e9e9e9;border-radius:6px;padding:12px}
.inv{background:#fff;color:#000;font:12px/1.4 Arial,Helvetica,sans-serif;padding:28px 34px;min-width:640px;max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.inv-logo img{max-height:110px;max-width:240px;display:block}
.inv-nologo{display:inline-block;border:1px dashed #aaa;color:#888;padding:20px 24px;font-size:11px}
.inv-top{display:flex;justify-content:space-between;gap:20px}
.inv-name{font-size:15px;font-weight:700}
.inv-date{font-size:15px;font-weight:700;white-space:nowrap}
.inv-title{font-size:26px;font-weight:700;text-align:center;margin-top:6px}
.inv-sub{text-align:center;font-size:10px;letter-spacing:.08em;margin-top:-8px}
.inv-num{font-size:15px;font-weight:700}
.inv-cli{border:1px solid #000;padding:8px 10px}
.inv-cname{font-size:15px;font-weight:700}
.inv .inv-t{border-collapse:collapse;width:100%;font-size:11.5px}
.inv .inv-t th{background:#c8c8c8;color:#000;border:1px solid #000;padding:5px 6px;font:700 11.5px Arial,Helvetica,sans-serif;letter-spacing:0;text-transform:none}
.inv .inv-t td{border-left:1px solid #000;border-right:1px solid #000;border-bottom:0;padding:4px 6px;vertical-align:top}
.inv .inv-t tbody tr:last-child td{border-bottom:1px solid #000}
.inv .inv-t .r{text-align:right}.inv .inv-t .c{text-align:center}
.inv .inv-t tr.inv-fill td{height:120px}
.inv .inv-s{margin-top:40px}
.inv .inv-s td{border:1px solid #000!important}
.inv-tot{align-self:flex-end;width:47%;border:1px solid #000;margin-top:-11px;padding:6px 8px;display:grid;gap:3px;font-weight:700}
.inv-tot div{display:flex;justify-content:flex-end;gap:10px}
.inv-tot span:last-child{min-width:110px;text-align:right}
.inv-tot .g{font-size:13px}
.inv-letras{font-weight:700;font-size:11px}
.inv-note{font-weight:700}
.inv-foot{font-style:italic;font-size:10px;text-align:center;color:#444;margin-top:24px}
.lbl{display:flex;gap:2mm;align-items:center;background:#fff;color:#000;width:50mm;height:25mm;padding:1.2mm 1.5mm;box-sizing:border-box;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.lbl .lq{flex:0 0 17mm;width:17mm;height:17mm}.lbl .lq svg{width:100%;height:100%;display:block}
.lbl .li{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;justify-content:space-between}
.lbl .ln{font-weight:700;font-size:7.5pt;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lv{font-size:6.5pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lp{font-weight:700;font-size:10.5pt}
.lbl .lb{width:100%;height:11mm;object-fit:fill;display:block}
.lbl-prev{display:flex;justify-content:center;background:var(--surface-2);border-radius:8px;padding:14px}
.lbl-prev .lbl{transform:scale(1.6);transform-origin:center;margin:12mm 0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#print-area{display:none}
@page lbl{size:50mm 25mm;margin:0}
@page tk{margin:0}
@page pa4{size:A4;margin:10mm}
@page pa4a{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body::before{display:none!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  #print-area.pa-t{page:tk;width:72mm;margin:0 auto;padding:3mm 0 8mm}
  #print-area.pa-a4{page:pa4;width:auto}
  #print-area.pa-lbl{page:lbl}
  #print-area.pa-lbl .lbl{break-after:page;page-break-after:always}
  #print-area.pa-lbla4{page:pa4a;display:grid!important;grid-template-columns:repeat(3,70mm);grid-auto-rows:37.1mm}
  #print-area.pa-lbla4 .lbl{width:70mm;height:37.1mm;padding:3mm}
  #print-area.pa-lbla4 .lbl .lq{flex-basis:26mm;width:26mm;height:26mm}
  #print-area.pa-lbla4 .lbl .lb{height:14mm}
  #print-area .inv{min-width:0;max-width:none;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-area .receipt img{max-width:45mm}
  #print-area .receipt{border:0;border-radius:0;max-width:none;width:72mm;padding:0;font-size:11.2px;line-height:1.5;color:#000}
  #print-area .receipt .rh{font-size:12px}
  #print-area .receipt .big{font-size:15px}
  #print-area .receipt .rh.c{font-size:13.5px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}
.welcome{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 18px}
.welcome img{width:84px;height:84px;object-fit:contain;border-radius:50%;background:#fff;padding:4px}
.welcome h1{margin:2px 0 0}
.aviso{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;color:inherit;font:inherit;cursor:pointer}
.aviso:last-child{border-bottom:0}.aviso b{margin-left:auto;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:16px}
.tile{border-radius:var(--r);padding:20px 18px;text-align:left;cursor:pointer;display:grid;gap:6px;min-height:104px;font:inherit;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}.tile b{font-size:18px}.tile span{font-size:13px}
.login{max-width:400px;margin:40px auto;text-align:center}.login form{display:grid;gap:12px;text-align:left;margin-top:14px}
.login .lnk{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:4px}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 10px}.login .or:before,.login .or:after{content:"";flex:1;border-top:1px solid var(--line)}
.cambox{border-radius:var(--r);overflow:hidden;background:#000;min-height:220px}
.cambox video{width:100%!important;display:block}
.camlog{display:grid;gap:4px;max-height:170px;overflow:auto}
.camrow{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--accent-soft)}
.camrow.bad{background:#ffe3e3;color:#a10f0f}
.scanbar{display:flex;gap:8px;align-items:center}.scanbar input{flex:1}
.btn.cam{white-space:nowrap}
.sheet .seg{display:flex;flex-wrap:nowrap}.sheet .seg button{flex:1;font-size:13px;padding:8px 6px}

function applyConfig(docs){
  const e=docs.find(d=>d.id==="empresa"),c=docs.find(d=>d.id==="correlativos");
  S.empresa={...DEF_EMP,...(e?strip(e):{})};S.correl=c?strip(c):{};
}
const store={
  async set(col,id,data){
    if(db){await db.collection(col).doc(id).set(data);return}
    if(col==="config"){const docs=[{id:"empresa",...S.empresa},{id:"correlativos",...S.correl}].filter(d=>d.id!==id);docs.push({id,...data});applyConfig(docs)}
    else{const a=S[col],i=a.findIndex(x=>x.id===id),o={id,...data};if(i>=0)a[i]=o;else a.push(o)}
    sortAll();persist();render();
  },
  async del(col,id){
    if(db){await db.collection(col).doc(id).delete();return}
    S[col]=S[col].filter(x=>x.id!==id);persist();render();
  }
};

let idbConn=null;
function idb(){if(idbConn)return Promise.resolve(idbConn);return new Promise((res,rej)=>{const r=indexedDB.open("streetfashion-pos",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(idbConn=r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

  saving=saving.then(()=>idbSet("datos",snap)).catch(e=>banner("No se pudo guardar en esta PC ("+(e&&e.name||"error")+"). Descarga una copia de seguridad desde Ajustes."))}

function subscribe(){
  const onErr=e=>banner("No se pudieron leer los datos ("+(e&&e.code)+"). Recarga la página.");
  db.collection("productos").onSnapshot(s=>{S.productos=s.docs.map(d=>({id:d.id,...d.data()}));sortAll();render()},onErr);
  db.collection("ventas").orderBy("fecha","desc").limit(1000).onSnapshot(s=>{S.ventas=s.docs.map(d=>({id:d.id,...d.data()}));sortAll();render()},onErr);
  db.collection("compras").orderBy("fecha","desc").limit(500).onSnapshot(s=>{S.compras=s.docs.map(d=>({id:d.id,...d.data()}));sortAll();render()},onErr);
  db.collection("config").onSnapshot(s=>{applyConfig(s.docs.map(d=>({id:d.id,...d.data()})));render()},onErr);
}

function periodo(k){
  const now=new Date();let start,end,n,label,idx,lab;
  if(k==="hoy"){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(start);end.setDate(end.getDate()+1);n=24;
    idx=d=>d.getHours();lab=i=>i%3===0?pad(i,2)+"h":"";label="Hoy, "+fFecha(start.toISOString())}
  else if(k==="semana"){const dow=(now.getDay()+6)%7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);end=new Date(start);end.setDate(end.getDate()+7);n=7;
    idx=d=>Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/864e5);lab=i=>DIAS[i];
    const e2=new Date(end);e2.setDate(e2.getDate()-1);label="Semana del "+fFecha(start.toISOString())+" al "+fFecha(e2.toISOString())}
  else if(k==="anio"){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear()+1,0,1);n=12;idx=d=>d.getMonth();lab=i=>MESES[i];label="Año "+now.getFullYear()}
  else{start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1);n=Math.round((end-start)/864e5);
    idx=d=>d.getDate()-1;lab=i=>(i===0||(i+1)%5===0)?String(i+1):"";label=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"][now.getMonth()]+" "+now.getFullYear()}
  return {start,end,n,idx,lab,label,nowIdx:idx(now)};
}
function niceMax(m){if(m<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(vals,P){
  const W=Math.max(300,Math.round(($("#app").clientWidth||700)-68)),H=W<500?200:240,pl=58,pr=6,pt=10,pb=26,ih=H-pt-pb,max=niceMax(Math.max(0,...vals)),bw=(W-pl-pr)/vals.length;
  let s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Ventas del periodo">';
  [0,.5,1].forEach(t=>{const y=pt+ih*(1-t);s+='<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+moneyShort(max*t)+"</text>"});
  vals.forEach((v,i)=>{const h=Math.max(v>0?2:0,v/max*ih),x=pl+i*bw+bw*.16;
    s+='<rect class="bar'+(i===P.nowIdx?" now":"")+'" style="fill:var(--c'+(i%8+1)+')" x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+(bw*.68).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"><title>'+esc(P.lab(i)||String(i+1))+": "+money(v)+"</title></rect>";

function letras(n){
  const U=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const D=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const dec=x=>x<30?U[x]:D[Math.floor(x/10)]+(x%10?" y "+U[x%10]:"");
  const cen=x=>x===100?"cien":(C[Math.floor(x/100)]+(x%100?" "+dec(x%100):"")).trim();
  const un=s=>s.replace(/uno$/,"un").replace(/veintiun$/,"veintiún");
  const mil=x=>x<1000?cen(x):(Math.floor(x/1000)===1?"mil":un(cen(Math.floor(x/1000)))+" mil")+(x%1000?" "+cen(x%1000):"");
  const ent=Math.floor(n+1e-9),c=Math.round((n-ent)*100);
  let w=ent===0?"cero":ent<1e6?mil(ent):(Math.floor(ent/1e6)===1?"un millón":un(mil(Math.floor(ent/1e6)))+" millones")+(ent%1e6?" "+mil(ent%1e6):"");
  return ("SON: "+w+" con "+pad(c,2)+"/100 soles").toUpperCase();
}
const TCOLS=40;
const up=s=>String(s||"").toUpperCase();
function wrapTxt(t,w){const out=[];String(t).split(/\s+/).filter(Boolean).forEach(word=>{const l=out.length?out[out.length-1]:null;if(l!==null&&(l+" "+word).length<=w)out[out.length-1]=l+" "+word;else{while(word.length>w){out.push(word.slice(0,w));word=word.slice(w)}out.push(word)}});return out.length?out:[""]}
function ticketLines(v){
  const e=S.empresa,W=TCOLS,f2=n=>r2(n).toFixed(2),L=[];
  const H=(t,o)=>L.push({t,k:"h",...o}),M=(t,o)=>L.push({t,k:"m",...o});
  const lr=(a,b)=>a+" ".repeat(Math.max(1,W-a.length-b.length))+b;
  const tot=(a,b)=>a.padEnd(18)+"S/"+b.padStart(W-20);
  const eq="=".repeat(W),da="-".repeat(W);
  H(up(e.razon||e.nombre),{b:1,big:1});
  H("RUC: "+(e.ruc||"(configurar en Ajustes)"));
  if(e.direccion)wrapTxt(e.direccion,44).forEach(t=>H(t));
  if(e.telefono)H("TELF.: "+e.telefono);
  if(e.email)H(e.email);
  M(eq);
  H({ticket:"NOTA DE VENTA",boleta:"BOLETA DE VENTA ELECTRÓNICA",factura:"FACTURA ELECTRÓNICA"}[v.tipo],{b:1,mid:1});
  H(v.numero,{b:1,mid:1});
  M(eq);
  M(lr("FECHA: "+fFecha(v.fecha),"HORA: "+fHora(v.fecha)));
  const c=v.cliente||{};
  wrapTxt((v.tipo==="factura"?"RAZÓN SOCIAL: ":"CLIENTE: ")+up(c.nombre||"Clientes varios"),W).forEach(t=>M(t));
  M((v.tipo==="factura"?"RUC: ":v.tipo==="boleta"?"DNI: ":"DNI/RUC: ")+(c.doc||"-"));
  if(v.tipo==="factura"&&c.direccion)wrapTxt("DIRECCIÓN: "+up(c.direccion),W).forEach(t=>M(t));
  M("MONEDA : SOLES");
  M(da);M(lr("DESCRIPCIÓN","IMPORTE"));M("  CANT x P.UNIT");M(da);
  (v.items||[]).forEach(it=>{wrapTxt(up(it.nombre+(it.talla?" T."+it.talla:"")+(it.color?" "+it.color:"")),W).forEach(t=>M(t));M(lr("  "+it.cant+" x "+f2(it.precio),f2(it.precio*it.cant)))});
  M(da);
  if(v.descuento>0)M(tot("DESCUENTO","-"+f2(v.descuento)));
  M(tot("OP. GRAVADA",f2(v.gravada)));M(tot("IGV (18%)",f2(v.igv)));M(tot("TOTAL A PAGAR",f2(v.total)),{b:1});
  M(da);
  wrapTxt(letras(v.total),W).forEach(t=>M(t));
  M(da);
  M(lr("FORMA DE PAGO:",up(v.pago)));
  if(v.pago==="Efectivo"){const rec=v.recibido||v.total;M(lr("RECIBIDO S/",f2(rec)));M(lr("VUELTO   S/",f2(v.recibido?v.vuelto:0)))}
  M(da);M("");
  if(v.tipo!=="ticket"){wrapTxt("Representación impresa de la "+TIPO_N[v.tipo].toLowerCase()+". Documento de prueba, aún no enviado a SUNAT.",W).forEach(t=>M(t,{mid:1,sm:1}));M("")}
  M("¡GRACIAS POR SU COMPRA!",{mid:1});
  wrapTxt(e.pie||"",W).forEach(t=>t&&M(t,{mid:1}));
  return L;
}

function invData(v){

      uds:it.cant,baseUd:r2(it.precio/(1+IGV)),base,igv:r2(tot-base)}});
  return {rows,titulo:v.tipo==="factura"?"FACTURA":"BOLETA DE VENTA",sub:v.tipo==="factura"?"FACTURA ELECTRÓNICA":"BOLETA DE VENTA ELECTRÓNICA",

function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=Number(d12[i])*(i%2?3:1);return String((10-s%10)%10)}
const isEAN13=c=>/^\d{13}$/.test(c)&&eanCheck(c.slice(0,12))===c[12];
function nextBarcode(extra){let mx=0;S.productos.concat(extra||[]).forEach(p=>{const b=String(p.barcode||"");if(/^20\d{11}$/.test(b))mx=Math.max(mx,Number(b.slice(2,12)))});const d12="20"+pad(mx+1,10);return d12+eanCheck(d12)}
const findByCode=c=>{c=String(c||"").split("|")[0].trim();if(!c)return null;const u=c.toUpperCase();return S.productos.find(p=>String(p.barcode||"")===c)||S.productos.find(p=>String(p.codigo||"").toUpperCase()===u)||null};
const qrText=p=>[p.barcode,p.codigo,[p.nombre,p.talla&&("T."+p.talla),p.color].filter(Boolean).join(" "),"S/ "+r2(p.precio).toFixed(2)].join("|");

function qrSVG(t){const q=qrObj(t);if(!q)return "";const n=q.getModuleCount();let r="";for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+="M"+x+" "+y+"h1v1h-1z";return '<svg viewBox="-1 -1 '+(n+2)+" "+(n+2)+'" shape-rendering="crispEdges"><rect x="-1" y="-1" width="'+(n+2)+'" height="'+(n+2)+'" fill="#fff"/><path d="'+r+'" fill="#000"/></svg>'}
const bcCache={};
function barcodePNG(code){if(bcCache[code])return bcCache[code];if(!window.JsBarcode)return "";try{const cv=document.createElement("canvas");JsBarcode(cv,code,{format:isEAN13(code)?"EAN13":"CODE128",width:3,height:90,fontSize:26,margin:6,textMargin:2,flat:true,background:"#ffffff"});return bcCache[code]=cv.toDataURL("image/png")}catch(e){return ""}}

async function hashClave(c,salt){const t=salt+"|"+c;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return "f"+h.toString(16)}}

async function guardarEdicion(id){
  const v=S.ventas.find(x=>x.id===id);if(!v)return;const err=$("#ed-err");
  const nuevos=[],cambios=[];
  for(let i=0;i<(v.items||[]).length;i++){const it=v.items[i],el=$("#ed-q"+i);const q=Math.round(Number(el.value));const dev=devueltas(v,it.productoId),p=prod(it.productoId),max=it.cant+(p?Number(p.stock)||0:0);
    if(!(q>=0)){err.textContent="Revisa las cantidades.";return}
    if(q<dev){err.textContent=it.nombre+": ya se devolvieron "+dev+", no puede quedar en menos.";return}
    if(q>max){err.textContent="No hay stock suficiente de "+it.nombre+" (máximo "+max+").";return}
    if(q!==it.cant)cambios.push({productoId:it.productoId,nombre:it.nombre,antes:it.cant,despues:q});
    if(q>0)nuevos.push({...it,cant:q})}
  if(!cambios.length){err.textContent="No cambiaste ninguna cantidad.";return}
  if(!nuevos.length){err.textContent="Si se quitan todas las prendas, mejor usa “Anular”.";return}
  const bruto=r2(nuevos.reduce((a,it)=>a+it.precio*it.cant,0)),desc=Math.min(bruto,Number(v.descuento)||0),total=r2(bruto-desc),grav=r2(total/(1+IGV));
  let rec=Number(v.recibido)||0;if(rec&&rec<total)rec=0;
  const nv={...strip(v),items:nuevos,bruto,descuento:desc,total,gravada:grav,igv:r2(total-grav),recibido:rec,vuelto:rec?r2(rec-total):0,
    ediciones:[...(v.ediciones||[]),{fecha:new Date().toISOString(),cambios,totalAntes:v.total,totalDespues:total,motivo:($("#ed-mot").value||"").trim()}]};
  const btn=document.querySelector('[data-act="edsave"]');if(btn)btn.disabled=true;
  try{await store.set("ventas",id,nv);
    for(const c of cambios){if(prod(c.productoId))await moverStock(c.productoId,c.antes-c.despues)}
    lastVenta={id,...nv};showVenta(lastVenta,false);toast("Venta corregida: "+money(v.total)+" → "+money(total)+"; stock ajustado")}
  catch(e){err.textContent="No se pudo guardar ("+(e&&e.code||"error")+").";if(btn)btn.disabled=false}
}

async function cobrar(){
  ui.posErr="";
  const items=ui.cart.map(c=>({c,p:prod(c.id)})).filter(x=>x.p);
  if(!items.length){ui.posErr="Agrega al menos un producto.";return render()}
  for(const {c,p} of items)if(c.cant>(Number(p.stock)||0)){ui.posErr="No hay stock suficiente de "+p.nombre+" (quedan "+p.stock+").";return render()}
  const bruto=r2(items.reduce((a,{c,p})=>a+p.precio*c.cant,0)),desc=Math.min(bruto,Math.max(0,r2(ui.descuento))),total=r2(bruto-desc),grav=r2(total/(1+IGV));
  const cli={doc:ui.cli.doc.trim(),nombre:ui.cli.nombre.trim(),direccion:ui.cli.direccion.trim()};
  if(ui.tipo==="factura"){if(!/^(10|15|17|20)\d{9}$/.test(cli.doc)){ui.posErr="La factura necesita un RUC válido de 11 dígitos.";return render()}if(!cli.nombre){ui.posErr="Escribe la razón social del cliente.";return render()}}
  if(ui.tipo==="boleta"){if(cli.doc&&!/^\d{8}$/.test(cli.doc)){ui.posErr="El DNI debe tener 8 dígitos.";return render()}if(total>=700&&!cli.doc){ui.posErr="Para boletas desde S/ 700 SUNAT exige el DNI del cliente.";return render()}}
  if(ui.tipo==="ticket"){cli.doc="";cli.direccion=""}
  if(ui.tipo!=="factura")cli.direccion="";
  const rec=ui.pago==="Efectivo"?r2(ui.recibido):0;
  if(rec&&rec<total){ui.posErr="El monto recibido es menor que el total.";return render()}
  const serie=SERIES[ui.tipo],n=(Number(S.correl[serie])||0)+1;
  const v={numero:serie+"-"+pad(n,8),serie,correlativo:n,tipo:ui.tipo,fecha:new Date().toISOString(),cliente:cli,
    items:items.map(({c,p})=>({productoId:p.id,codigo:p.codigo||"",nombre:p.nombre,talla:p.talla||"",color:p.color||"",cant:c.cant,precio:Number(p.precio)||0,costo:Number(p.costo)||0})),
    bruto,descuento:desc,gravada:grav,igv:r2(total-grav),total,pago:ui.pago,recibido:rec,vuelto:rec?r2(rec-total):0,estado:"emitida"};
  ui.busy=true;render();
  try{
    let id=uid();
    if(S.mode==="nube"&&fsRaw){const r=await cobrarNube(items,serie,v);id=r.id;delete r.id;Object.assign(v,r)}

    }
    ui.cart=[];ui.cli={doc:"",nombre:"",direccion:""};ui.recibido="";ui.descuento="";ui.busy=false;render();
    lastVenta={id,...v};showVenta(lastVenta,true);if(canPrint()&&pref.get("autoprint")==="1")imprimir(lastVenta);
  }catch(e){ui.busy=false;const c=e&&e.code||"error";ui.posErr=c==="sin-stock"?e.msg:(c==="sin-internet"||c==="unavailable")?"Sin conexión a internet. Para cobrar en la nube se necesita internet; revisa tu conexión e inténtalo de nuevo.":"No se pudo guardar la venta ("+c+"). Inténtalo de nuevo.";render()}
}

  (avisos.length?'<div class="card">'+avisos.map(([a,t])=>'<button class="aviso" data-act="'+a+'"><span>⚠️</span>'+esc(t)+'<b>›</b></button>').join("")+"</div>":"")+
  '<div class="kpis"><div class="kpi k1"><span class="l">Vendido hoy</span><span class="v">'+money(tot)+'</span></div><div class="kpi k2"><span class="l">Ventas de hoy</span><span class="v">'+vs.length+'</span></div><div class="kpi k3"><span class="l">Prendas vendidas hoy</span><span class="v">'+und+'</span></div><div class="kpi k4"><span class="l">Productos por reponer</span><span class="v">'+rep+"</span></div></div>"+
  '<div class="tiles">'+tiles.map(([v,t,s,k])=>'<button class="tile '+k+'" data-act="go" data-v="'+v+'"><b>'+t+"</b><span>"+s+"</span></button>").join("")+"</div>";
}

/* ---------- nube (Firebase) ---------- */
let fsRaw=null;
/* ---------- escáner con cámara ---------- */
const H5Q_URL="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
let camScan=null,camLast={c:"",t:0},camLog=[];
function cargarH5Q(){if(window.Html5Qrcode)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement("script");s.src=H5Q_URL;s.onload=res;s.onerror=()=>rej(new Error("lib"));document.head.appendChild(s)})}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1250;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},90)}catch(e){}try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function scanDestino(){return S.mode==="nube"&&pref.get("scandest")==="caja"?"caja":"aqui"}
function camLogHTML(){return camLog.length?camLog.slice(0,6).map(x=>'<div class="camrow'+(x.ok?"":" bad")+'">'+(x.ok?"✓ ":"✗ ")+esc(x.t)+"</div>").join(""):'<p class="muted" style="margin:0;font-size:13px">Apunta la cámara al código de barras o QR de la etiqueta.</p>'}
function camPintar(){const l=$("#cam-log");if(l)l.innerHTML=camLogHTML()}
async function abrirCamara(){
  camLog=[];
  const dest=scanDestino();
  openModal('<div class="sheet-h"><h2>Escanear con cámara</h2><button class="x" data-act="camclose" aria-label="Cerrar">×</button></div>'+
    (S.mode==="nube"?'<div class="seg" role="group" aria-label="Destino" style="width:100%"><button data-act="camdest" data-k="aqui" aria-pressed="'+(dest==="aqui")+'">Vender en este celular</button><button data-act="camdest" data-k="caja" aria-pressed="'+(dest==="caja")+'">Enviar a la caja (PC)</button></div>':"")+
    '<div id="cam-box" class="cambox"><p class="muted" style="margin:0;padding:40px 10px;text-align:center">Abriendo la cámara…</p></div>'+
    '<div id="cam-log" class="camlog">'+camLogHTML()+'</div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="camclose">Listo</button></div>');
  try{await cargarH5Q()}catch(e){$("#cam-box").innerHTML='<p class="err" style="padding:16px">No se pudo cargar el lector. Revisa tu conexión a internet.</p>';return}
  const F=window.Html5QrcodeSupportedFormats;
  camScan=new Html5Qrcode("cam-box",{formatsToSupport:[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.UPC_A,F.UPC_E,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  try{await camScan.start({facingMode:"environment"},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.9,340)),height:Math.floor(Math.min(h*.6,200))})},leido,()=>{})}
  catch(e){const m=String(e&&e.name||e||"");$("#cam-box").innerHTML='<p class="err" style="padding:16px">'+(/NotAllowed|Permission/i.test(m)?"No diste permiso para usar la cámara. Actívalo en la configuración del navegador (ícono del candado junto a la dirección) y vuelve a intentarlo.":/NotFound|Overconstrained/i.test(m)?"Este equipo no tiene cámara disponible.":"No se pudo abrir la cámara ("+esc(m)+").")+"</p>";camScan=null}
}
async function cerrarCamara(){const s=camScan;camScan=null;if(s){try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}closeModal();render()}
async function leido(txt){
  const now=Date.now();if(txt===camLast.c&&now-camLast.t<1500){camLast.t=now;return}camLast={c:txt,t:now};
  const p=findByCode(txt);
  if(!p){camLog.unshift({ok:false,t:"No existe el código "+String(txt).split("|")[0]});camPintar();try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(e){}return}
  beep();
  if(scanDestino()==="caja"){
    try{await store.set("escaneos",uid(),{codigo:p.barcode||p.codigo||txt,productoId:p.id,fecha:new Date().toISOString()});camLog.unshift({ok:true,t:"Enviado a la caja: "+plabel(p)})}
    catch(e){camLog.unshift({ok:false,t:"No se pudo enviar ("+(e&&e.code||"error")+")"})}
    camPintar();return}
  const c=ui.cart.find(x=>x.id===p.id),enCarro=c?c.cant:0;
  if(enCarro>=(Number(p.stock)||0)){camLog.unshift({ok:false,t:"Sin stock: "+plabel(p)});camPintar();return}
  if(c)c.cant++;else ui.cart.push({id:p.id,cant:1});
  camLog.unshift({ok:true,t:"+1 "+plabel(p)+" · "+money(p.precio)});camPintar();
  if(view!=="vender"){view="vender";try{history.replaceState(null,"","#vender")}catch(e){}}
}
/* la caja (PC) recibe lo que escanean los celulares */
let escUnsub=null;const escHechos=new Set();
function recibeEscaneos(){return S.mode==="nube"&&pref.get("recibir")!=="0"&&!(window.matchMedia&&matchMedia("(pointer:coarse)").matches&&pref.get("recibir")!=="1")}
function escucharEscaneos(){
  if(escUnsub){try{escUnsub()}catch(e){}escUnsub=null}
  if(!recibeEscaneos()||!fsRaw)return;
  escUnsub=fsRaw.collection("escaneos").onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type!=="added")return;const id=ch.doc.id,d=ch.doc.data();if(escHechos.has(id))return;escHechos.add(id);
    const ref=fsRaw.collection("escaneos").doc(id);
    if(Date.now()-new Date(d.fecha).getTime()>120000){ref.delete().catch(()=>{});return}
    fsRaw.runTransaction(async t=>{const x=await t.get(ref);if(!x.exists)return false;t.delete(ref);return true}).then(ok=>{if(ok)handleScan(d.codigo)}).catch(()=>{})})},()=>{});
  fsUnsubs.push(()=>{if(escUnsub){escUnsub();escUnsub=null}});
}
/* stock: en la nube se suma o resta en el servidor para que dos equipos no se pisen */
async function moverStock(id,delta,extra){
  if(S.mode==="nube"&&fsRaw){fsRaw.collection("productos").doc(id).update({stock:firebase.firestore.FieldValue.increment(delta),...(extra||{})}).catch(nubeErr);return}
  const p=prod(id);if(p)await store.set("productos",id,{...strip(p),stock:(Number(p.stock)||0)+delta,...(extra||{})})}
async function cobrarNube(items,serie,v){
  const ref=fsRaw.collection("ventas").doc(uid());
  const tx=fsRaw.runTransaction(async t=>{
    const cref=fsRaw.collection("config").doc("correlativos"),cs=await t.get(cref),cur=cs.exists?cs.data():{};
    const prefs=items.map(({p})=>fsRaw.collection("productos").doc(p.id)),snaps=[];for(const r of prefs)snaps.push(await t.get(r));
    snaps.forEach((s,i)=>{const st=Number((s.data()||{}).stock)||0;if(items[i].c.cant>st){const e=new Error("stock");e.code="sin-stock";e.msg="No hay stock suficiente de "+items[i].p.nombre+" (quedan "+st+").";throw e}});
    const n=(Number(cur[serie])||0)+1;const vv={...v,correlativo:n,numero:serie+"-"+pad(n,8)};
    t.set(cref,{...cur,[serie]:n});t.set(ref,vv);
    snaps.forEach((s,i)=>t.update(prefs[i],{stock:firebase.firestore.FieldValue.increment(-items[i].c.cant)}));
    return vv});
  const to=new Promise((_,rej)=>setTimeout(()=>{const e=new Error("timeout");e.code="sin-internet";rej(e)},20000));
  const vv=await Promise.race([tx,to]);return {id:ref.id,...vv}}


let fbAuth=null,nubeMsg="";
function loginHTML(){return '<div class="card login">'+(DEF_EMP.logo?'<img src="'+esc(DEF_EMP.logo)+'" alt="" style="width:120px;height:120px;object-fit:contain;margin:0 auto 10px;display:block;background:#fff;border-radius:50%;padding:6px">':"")+
  '<h2 style="margin:0 0 4px">STREET FASHIÓN SAC</h2><p class="muted" style="margin:0">Sistema de ventas e inventario</p>'+
  '<form data-form="login"><label class="f">Usuario<input id="lg-u" autocomplete="username" autocapitalize="none" placeholder="Tu usuario o correo"></label>'+
  '<label class="f">Contraseña<input id="lg-p" type="password" autocomplete="current-password"></label>'+
  '<button class="btn pri" type="submit" style="width:100%;justify-content:center">Ingresar</button></form>'+
  '<p class="err" id="lg-err" style="margin:10px 0 0">'+esc(nubeMsg)+'</p><button class="lnk" data-act="olvido">¿Olvidaste tu contraseña?</button>'+
  '<div class="or">o</div><button class="btn" data-act="glogin" style="width:100%;justify-content:center">Entrar con Google</button></div>'}
function emailDe(u){u=String(u||"").trim().toLowerCase();if(u.includes("@"))return u;const m=window.FB_USERS||{};return m[u]||""}
function pwModal(){openModal('<div class="sheet-h"><h2>'+(S.tienePass?"Cambiar":"Crear")+' contraseña de ingreso</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>'+
  '<p class="muted" style="margin:0">Usuario: <b>'+esc(Object.keys(window.FB_USERS||{}).find(k=>FB_USERS[k]===String(S.usuario).toLowerCase())||S.usuario)+'</b>. La contraseña debe tener al menos 6 caracteres.</p>'+
  '<form data-form="pwset" class="fields"><label class="f">Nueva contraseña<input type="password" id="pw-1" autocomplete="new-password"></label><label class="f">Repite la contraseña<input type="password" id="pw-2" autocomplete="new-password"></label><p class="err span2" id="pw-err" style="margin:0"></p>'+
  '<div class="row span2" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar contraseña</button></div></form>',true)}
function nubeErr(e){banner("No se pudo guardar en la nube ("+(e&&e.code||"error")+"). Revisa tu conexión y vuelve a intentarlo.")}
let fsUnsubs=[];
function cortarNube(){fsUnsubs.forEach(f=>{try{f()}catch(e){}});fsUnsubs=[]}
function wrapQ(q){return{orderBy:(...a)=>wrapQ(q.orderBy(...a)),limit:n=>wrapQ(q.limit(n)),onSnapshot:(...a)=>{const u=q.onSnapshot(...a);fsUnsubs.push(u);return u}}}
function wrapFS(fs){return{collection:c=>{const r=fs.collection(c);return{...wrapQ(r),
  doc:id=>{const d=r.doc(id);return{set:x=>{d.set(x).catch(nubeErr);return Promise.resolve()},delete:()=>{d.delete().catch(nubeErr);return Promise.resolve()}}},
}}}}
async function importarDatos(o){
  if(S.mode!=="nube"){loadLocal(o);persist();render();return}
  const tareas=[];for(const k of ["productos","ventas","compras"])for(const x of (o[k]||[]))if(x&&x.id)tareas.push([k,x.id,strip(x)]);
  tareas.push(["config","empresa",{...DEF_EMP,...strip(o.empresa||{})}],["config","correlativos",o.correl||{}]);
  for(const [k,id,x] of tareas)await store.set(k,id,x);
}
function startNube(){
  firebase.initializeApp(window.FB_CONFIG);fbAuth=firebase.auth();const fs=firebase.firestore();fsRaw=fs;
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const permitidos=(window.FB_ALLOWED||[]).map(x=>String(x).toLowerCase());
  try{fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION)}catch(e){}
  let primera=true;
  fbAuth.onAuthStateChanged(u=>{
    let ses=null;try{ses=sessionStorage.getItem("sf-sesion")}catch(e){}
    if(u&&primera&&!ses){primera=false;fbAuth.signOut();return}
    primera=false;
    if(!u){cortarNube();db=null;S.mode="login";render();return}
    if(permitidos.length&&!permitidos.includes(String(u.email).toLowerCase())){nubeMsg="La cuenta "+u.email+" no tiene acceso a este sistema.";fbAuth.signOut();return}
    nubeMsg="";S.usuario=u.email;S.usuarioNombre=u.displayName||"";S.tienePass=(u.providerData||[]).some(p=>p&&p.providerId==="password");
    if(S.mode!=="nube"){db=wrapFS(fs);S.mode="nube";view="inicio";try{history.replaceState(null,"","#inicio")}catch(e){}subscribe();escucharEscaneos()}render()});
}
/* ---------- arranque ---------- */
async function start(){
  render();
  if(window.FB_CONFIG&&window.firebase){startNube();return}
  const use=window.claude&&window.claude.use;
  if(use){try{[db,downloads]=await Promise.all([window.claude.use("db"),window.claude.use("downloads")])}catch(e){db=null}}
  if(db){S.mode="db";subscribe();render()}
  else{S.mode="local";let ok=true;
    try{let o=await idbGet("datos");
      if(!o){let raw=null;try{raw=localStorage.getItem(LKEY)}catch(e){}if(raw){o=JSON.parse(raw);await idbSet("datos",o);try{localStorage.setItem(LKEY+"-migrado",new Date().toISOString());localStorage.removeItem(LKEY)}catch(e){}}}
      if(o)loadLocal(o);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){ok=false}
    if(!ok){S.mode="memoria";banner("Este navegador no permite guardar datos. Lo que registres se perderá al cerrar la página.")}
    render()}
}
start();
})();
